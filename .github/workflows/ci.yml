name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu runner 自带 Android SDK 且许可已接受，AGP 按需下载缺失的 platform/build-tools
      - uses: gradle/actions/setup-gradle@v4

      - name: Build, Lint & Unit Test
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace
        continue-on-error: true

      - name: Upload test reports (取证)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/test-results/
            app/build/reports/tests/

      - name: Fail if previous steps failed
        if: ${{ failure() }}
        run: exit 1

  instrumented-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            chmod +x gradlew
            ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/outputs/androidTest-results/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: catplan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
